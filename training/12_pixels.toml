estimator_params.early_stopping = true
estimator_params.validation_fraction = 0.1
estimator_params.n_iter_no_change = 15
estimator_params.batch_size = 1024
estimator_params.random_state = 42
estimator_params.verbose = true

[randomforest_flux_12_pixels_v12]
box_size = 12
